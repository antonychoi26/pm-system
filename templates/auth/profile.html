{% extends "base.html" %}
{% block title %}個人設定{% endblock %}
{% block page_title %}個人設定{% endblock %}

{% block content %}
<div class="row justify-content-center">
<div class="col-md-6">
<div class="section-card">
  <h6><i class="fas fa-user-cog me-2 text-primary"></i>個人資料設定</h6>

  {% if error %}
  <div class="alert alert-danger" style="font-size:13px;">{{ error }}</div>
  {% endif %}
  {% if success %}
  <div class="alert alert-success" style="font-size:13px;">{{ success }}</div>
  {% endif %}

  <form method="POST">
    <div class="mb-3">
      <label class="form-label">用戶名</label>
      <input type="text" class="form-control bg-light" value="{{ current_user.username }}" disabled>
    </div>
    <div class="mb-3">
      <label class="form-label">顯示名稱 <span class="text-danger">*</span></label>
      <input type="text" name="display_name" class="form-control"
             value="{{ current_user.display_name }}" required>
    </div>
    <div class="mb-3">
      <label class="form-label">電郵地址</label>
      <input type="email" name="email" class="form-control"
             value="{{ current_user.email or '' }}">
    </div>
    <div class="mb-3">
      <label class="form-label">角色</label>
      <input type="text" class="form-control bg-light"
             value="{% if current_user.is_admin %}管理員{% elif current_user.role == 'manager' %}主管{% else %}員工{% endif %}" disabled>
    </div>
    <hr>
    <h6 class="text-muted mb-3" style="font-size:13px;">更改密碼（不更改請留空）</h6>
    <div class="mb-3">
      <label class="form-label">新密碼</label>
      <input type="password" name="new_password" class="form-control" placeholder="最少6個字元">
    </div>
    <div class="mb-3">
      <label class="form-label">確認新密碼</label>
      <input type="password" name="confirm_password" class="form-control">
    </div>
    <div class="d-flex gap-2">
      <button type="submit" class="btn btn-primary"><i class="fas fa-save me-1"></i>儲存</button>
      <a href="{{ url_for('dashboard.index') }}" class="btn btn-outline-secondary">取消</a>
    </div>
  </form>
</div>
</div>
</div>
{% endblock %}
