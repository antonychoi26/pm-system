<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登入 &mdash; 物業管理工作清單系統</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" rel="stylesheet">
<style>
  body {
    min-height:100vh; background: linear-gradient(135deg,#1a3a5c 0%,#2e86de 100%);
    display:flex; align-items:center; justify-content:center;
    font-family:'Segoe UI','PingFang TC',sans-serif;
  }
  .login-card {
    background:#fff; border-radius:20px; padding:40px 48px;
    box-shadow:0 20px 60px rgba(0,0,0,0.2); width:100%; max-width:420px;
  }
  .login-logo { text-align:center; margin-bottom:28px; }
  .login-logo .icon-wrap {
    width:72px; height:72px; background:linear-gradient(135deg,#1a3a5c,#2e86de);
    border-radius:18px; display:inline-flex; align-items:center; justify-content:center;
    margin-bottom:12px;
  }
  .login-logo h4 { color:#1a3a5c; font-weight:700; margin:0; font-size:20px; }
  .login-logo small { color:#6c757d; font-size:13px; }
  .form-control { border-radius:10px; padding:11px 16px; border:1.5px solid #e0e0e0; font-size:14px; }
  .form-control:focus { border-color:#2e86de; box-shadow:0 0 0 3px rgba(46,134,222,0.15); }
  .btn-login {
    background:linear-gradient(135deg,#1a3a5c,#2e86de); color:#fff;
    border:none; border-radius:10px; padding:12px; font-size:15px; font-weight:600;
    width:100%; transition:opacity 0.2s;
  }
  .btn-login:hover { opacity:0.9; color:#fff; }
  .input-group-text { background:#f8f9fa; border:1.5px solid #e0e0e0; border-right:none; border-radius:10px 0 0 10px; }
  .input-group .form-control { border-left:none; border-radius:0 10px 10px 0; }
  .input-group .form-control:focus { z-index:3; }
  .version-tag { text-align:center; margin-top:20px; color:#aaa; font-size:11px; }
</style>
</head>
<body>
<div class="login-card">
  <div class="login-logo">
    <div class="icon-wrap">
      <i class="fas fa-building text-white fs-3"></i>
    </div>
    <h4>物業管理工作清單</h4>
    <small>Property Management Working List System</small>
  </div>

  {% if error %}
  <div class="alert alert-danger d-flex align-items-center gap-2" style="border-radius:10px;font-size:13px;">
    <i class="fas fa-exclamation-circle"></i> {{ error }}
  </div>
  {% endif %}

  <form method="POST" action="{{ url_for('auth.login') }}">
    <div class="mb-3">
      <label class="form-label fw-semibold text-secondary" style="font-size:13px;">用戶名</label>
      <div class="input-group">
        <span class="input-group-text"><i class="fas fa-user text-secondary"></i></span>
        <input type="text" name="username" class="form-control" placeholder="請輸入用戶名" required autofocus>
      </div>
    </div>
    <div class="mb-3">
      <label class="form-label fw-semibold text-secondary" style="font-size:13px;">密碼</label>
      <div class="input-group">
        <span class="input-group-text"><i class="fas fa-lock text-secondary"></i></span>
        <input type="password" name="password" class="form-control" placeholder="請輸入密碼" required>
      </div>
    </div>
    <div class="mb-4">
      <div class="alert alert-light d-flex align-items-center gap-2 py-2 px-3 mb-0"
           style="border-radius:8px; font-size:12px; color:#6c757d; border:1px solid #e9ecef;">
        <i class="fas fa-info-circle text-primary"></i>
        每次登入會自動登出前一位用戶，共用電腦請放心使用。
      </div>
    </div>
    <button type="submit" class="btn btn-login">
      <i class="fas fa-sign-in-alt me-2"></i>登入
    </button>
  </form>
  <div class="version-tag">v1.0 &copy; 2025 物業管理部</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
