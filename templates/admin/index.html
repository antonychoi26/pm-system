{% extends "base.html" %}
{% block title %}管理設定{% endblock %}
{% block page_title %}管理設定{% endblock %}

{% block content %}
<div class="row g-3">
  {% if current_user.is_admin %}
  <div class="col-md-3">
    <a href="{{ url_for('admin.estates') }}" class="text-decoration-none">
      <div class="section-card text-center py-4">
        <i class="fas fa-city fa-3x text-primary mb-3"></i>
        <h6 class="mb-1">屋苑管理</h6>
        <small class="text-muted">增刪屋苑，設定基本資料</small>
      </div>
    </a>
  </div>
  {% endif %}
  <div class="col-md-3">
    <a href="{{ url_for('admin.users') }}" class="text-decoration-none">
      <div class="section-card text-center py-4">
        <i class="fas fa-users fa-3x text-success mb-3"></i>
        <h6 class="mb-1">用戶管理</h6>
        <small class="text-muted">增刪員工，設定角色與屋苑</small>
      </div>
    </a>
  </div>
  <div class="col-md-3">
    <a href="{{ url_for('admin.categories') }}" class="text-decoration-none">
      <div class="section-card text-center py-4">
        <i class="fas fa-tags fa-3x text-warning mb-3"></i>
        <h6 class="mb-1">事項種類</h6>
        <small class="text-muted">自定義工作種類清單</small>
      </div>
    </a>
  </div>
  <div class="col-md-3">
    <a href="{{ url_for('admin.statuses') }}" class="text-decoration-none">
      <div class="section-card text-center py-4">
        <i class="fas fa-stream fa-3x text-info mb-3"></i>
        <h6 class="mb-1">事項狀況</h6>
        <small class="text-muted">自定義事項狀況清單</small>
      </div>
    </a>
  </div>
  <div class="col-md-3">
    <a href="{{ url_for('admin.todo_templates') }}" class="text-decoration-none">
      <div class="section-card text-center py-4">
        <i class="fas fa-layer-group fa-3x text-success mb-3"></i>
        <h6 class="mb-1">工作流程範本</h6>
        <small class="text-muted">建立標準化跟進流程步驟</small>
      </div>
    </a>
  </div>
</div>
{% endblock %}
